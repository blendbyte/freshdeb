# config.yaml: repository-wide settings for freshdeb
#
# Everything package-specific lives in packages/<name>/package.yaml.
# See docs/packages.md for that schema.
#
# archive:
#   url              Public APT URL; shown in docs and install snippets
#   origin, label    Written into each dists/<codename>/Release file
#   maintainer       Maintainer field of every package we build. Debian's
#                    maintainers did not build our packages, so their name
#                    must not end up in our control files.
#   keyring          File name of the exported public keyring at the
#                    repository root
#
# distributions:     Every codename we build for. Adding one here adds it to
#                    every package (unless a package opts out) and to the
#                    reprepro configuration.
#   vendor           debian or ubuntu
#   version          Numeric release; used in package versions
#                    (…~deb12, …~ubuntu24.04) so that dist-upgrades always
#                    move to the newer distribution's build. Codenames are
#                    not used there because they don't sort (forky < trixie).
#   image            Docker base image for building and testing
#
# architectures:     dpkg architectures to build for, each with the GitHub
#                    runner that builds it natively (nothing is emulated).
#                    The first one also builds Architecture: all packages.
#
# toolchains:        Compilers downloaded instead of the distribution's, which
#                    are too old on bookworm/jammy for current upstreams.
#   go               Go releases from go.dev, sha256 per architecture. Tracks
#                    pick one (go: "1.27.3"); watch.yml adds new patch
#                    releases (security fixes) and opens rebuild PRs.

archive:
  url: https://deb.freshdeb.com
  origin: freshdeb
  label: freshdeb
  maintainer: "freshdeb <packages@freshdeb.com>"
  keyring: freshdeb-archive-keyring.gpg

distributions:
  bookworm:
    vendor: debian
    version: "12"
    image: debian:bookworm
  trixie:
    vendor: debian
    version: "13"
    image: debian:trixie
  jammy:
    vendor: ubuntu
    version: "22.04"
    image: ubuntu:jammy
  noble:
    vendor: ubuntu
    version: "24.04"
    image: ubuntu:noble
  resolute:
    vendor: ubuntu
    version: "26.04"
    image: ubuntu:resolute

architectures:
  amd64:
    runner: ubuntu-24.04
  arm64:
    runner: ubuntu-24.04-arm

toolchains:
  go:
    "1.26.10":
      amd64: ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5
      arm64: 3f4227ce7b206a513e794f1393adb473a07b46e94d18bd15d1c684bbb7319797
    "1.27.3":
      amd64: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
      arm64: a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49
