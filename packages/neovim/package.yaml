# Neovim (https://neovim.io), Debian's packaging, built with neovim's bundled dependencies like upstream's releases.

name: neovim
description: "Neovim text editor"
homepage: https://neovim.io

upstream:
  git: https://github.com/neovim/neovim.git
  tag_regex: '^v(?P<version>\d+\.\d+\.\d+)$'  # not "stable"/"nightly"

packaging:
  origin: https://salsa.debian.org/vim-team/neovim.git
  ref: 9b99e384350e71beaddccd07d0452ad02f3d1803  # 0.12.4-1, unstable

# The bundled versions come with each release (cmake.deps/deps.txt); only the hook's skip list is kept by hand.
tracks:
  main:
    tag: "v0.12.6"
    commit: 779c36969e31080503be2dfccbcc3f999e289606
    revision: 1

overlays:
  # Bundled dependencies instead of system libraries (all releases).
  - patch: overlays/bundled-deps.patch

build:
  # Downloads and verifies the bundled dependencies listed in upstream's
  # cmake.deps/deps.txt, so the build runs offline.
  prepare: hooks/prefetch-deps.py
