#
# Proftpd sample configuration for counter.
# please uncomment configurations to activate
#
<IfModule mod_counter.c.c>
## Syntax: CounterEngine on|off
## Default: off
## Context: server config, <VirtualHost>, <Global>

## Syntax: CounterFile path
## Default: None
## Context: server config, <VirtualHost>, <Global>, <Anonymous>, <Directory>

## Syntax: CounterLog path|"none"
## Default: None
## Context: server config, <VirtualHost>, <Global>

## Syntax: CounterMaxReaders max
## Default: 0
## Context: server config, <VirtualHost>, <Global>, <Anonymous>, <Directory>

## Syntax: CounterMaxWriters max
## Default: 1
## Context: server config, <VirtualHost>, <Global>, <Anonymous>, <Directory>

## You can use mod_counter to prevent an uploaded file from being deleted or 
## renamed before the uploading client has finished the upload by using:
#  <IfModule mod_counter.c>
#    CounterEngine on
#    CounterFile /var/proftpd/counter.txt
#
#    # Allow only one client at a time to be writing (including deletes and renames) to a given file.
#    CounterMaxWriters 1
#  </IfModule>

## Likewise, if for some reason you need to limit the number of clients which can be
## downloading a given file at the same time, you would use the CounterMaxReaders directive:
#  <IfModule mod_counter.c>
#    CounterEngine on
#    CounterFile /var/proftpd/counter.txt
#
#    # Allow only three clients at a time to be reading the same file
#    CounterMaxReaders 3
#  </IfModule>

</IfModule>

