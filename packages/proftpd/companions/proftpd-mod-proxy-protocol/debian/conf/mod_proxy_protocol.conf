#
# ProFTPD sample configuration for mod_proxy_protocol.
# https://htmlpreview.github.io/?https://github.com/Castaglia/proftpd-mod_proxy_protocol/blob/master/mod_proxy_protocol.html
#
# This file belongs to '/etc/proftpd/conf.d'
#

<Class expect-proxy-protocol>
    ## Haproxy address:
    From 127.0.0.1
</Class>


<IfModule mod_proxy_protocol.c>
    ProxyProtocolEngine on
    ProxyProtocolTimeout 3sec

    ProxyProtocolVersion haproxyV2

    # Necessary to allow data transfers
    AllowForeignAddress on
    AllowForeignAddress expect-proxy-protocol
</IfModule>
