# Prometheus postgres_exporter: https://github.com/prometheus-community/postgres_exporter
#
# Packaging is Debian's (salsa.debian.org/go-team/packages/
# prometheus-postgres-exporter); debian/ is an unmodified import of the commit
# in packaging.ref. Debian builds against Debian-packaged Go libraries that
# only exist in unstable; overlays/go-build.patch builds with a pinned Go
# toolchain and vendored, checksum-verified modules instead, like upstream's
# release binaries. See README.md.
#
# Upstream supports only its latest release, so there is one track, "main",
# that follows every release (component main).

name: prometheus-postgres-exporter
description: "Prometheus exporter for PostgreSQL server metrics (postgres_exporter)"
homepage: https://github.com/prometheus-community/postgres_exporter

upstream:
  git: https://github.com/prometheus-community/postgres_exporter.git
  tag_regex: '^v(?P<version>\d+\.\d+\.\d+)$'

packaging:
  origin: https://salsa.debian.org/go-team/packages/prometheus-postgres-exporter.git
  ref: 038e2871638423ff97be95020bec21abb2da814c  # 0.19.1-1, unstable

tracks:
  main:
    tag: "v0.20.1"
    commit: 867fbcac31cd18c143e244190ea9168cca069827
    revision: 1
    go: "1.26.10"  # upstream's release build: Go 1.26 (.promu.yml); go.mod: go 1.25.0
    patches: patches/main  # empty: Debian's only patch (kingpin import path) isn't needed with vendored modules

overlays:
  # Pinned Go toolchain and vendored modules instead of dh-golang (all
  # releases), and a NEWS entry for the changes since the distributions'
  # versions.
  - patch: overlays/go-build.patch
  # The init script didn't export /etc/default's settings, so without
  # systemd the exporter never got DATA_SOURCE_NAME (all releases).
  - patch: overlays/init-export-environment.patch
