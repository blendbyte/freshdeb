# git (https://git-scm.com), Debian's packaging (repo.or.cz/git/debian.git), which changes no upstream files.

name: git
description: "git version control system"
homepage: https://git-scm.com
upstream:
  git: https://github.com/git/git.git
  tag_regex: '^v(?P<version>\d+\.\d+\.\d+)$'
  # The release tarball, as Debian (generated configure); matches kernel.org's signed sha256sums.asc.
  tarball: https://www.kernel.org/pub/software/scm/git/git-{version}.tar.xz
packaging:
  origin: https://repo.or.cz/git/debian.git
  ref: 033fba3a4ed08d1fd437cdd486a8d0b93558fe37 # 1:2.55.0-1, unstable
epoch: 1 # Debian's git versions carry one (1:2.39.5-…)
tracks:
  main:
    tag: "v2.56.1"
    commit: 03b41523c576f26ad34085378717a0c1b287470f
    sha256: f0b0bf89264b9bd2e1c640363e7529643989da76281600473c50745cd34a607f
    revision: 1
build:
  # git's test suite is upstream's job (5-15 min per build); tests/ and the autopkgtests are our gate.
  options: [nocheck]
