# memcached (https://memcached.org), Debian's packaging (lamby/pkg-memcached), from the release tarball (the git tag has no configure).

name: memcached
description: "memcached in-memory object cache"
homepage: https://memcached.org

upstream:
  git: https://github.com/memcached/memcached.git
  tag_regex: '^(?P<version>\d+\.\d+\.\d+)$'
  tarball: https://memcached.org/files/memcached-{version}.tar.gz

packaging:
  origin: https://salsa.debian.org/lamby/pkg-memcached.git
  ref: b3d5bbdf34f3297045a8ccf042ebee798e121806  # 1.6.45-1, unstable

tracks:
  main:
    tag: "1.6.45"
    commit: 2d51e364799bc9698bd4b11728ea978cea12da6e
    sha256: d362c64e6d8d5287153501eabf7c85b4a761432fbf53f5d7b085d0bb1653c1dd
    revision: 3
    patches: patches/main  # Debian's, without 0006-Don-t-use-embedded-Lua (the proxy uses upstream's vendor/lua)

overlays:
  # The proxy with upstream's bundled Lua (vendor/lua) instead of lua5.4, as upstream builds it.
  - patch: overlays/bundled-lua.patch

build:
  # Upstream's test suite is upstream's job (7 min per build); tests/ and the autopkgtests are our gate.
  options: [nocheck]
