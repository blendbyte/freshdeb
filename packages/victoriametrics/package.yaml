# VictoriaMetrics: https://github.com/VictoriaMetrics/VictoriaMetrics
#
# Packaging is Debian's (salsa.debian.org/go-team/packages/victoriametrics);
# debian/ is an unmodified import of the commit in packaging.ref. Debian
# builds against ~60 Debian-packaged Go libraries and removes the web UI
# (vmui) from its source; overlays/go-build.patch builds with a pinned Go
# toolchain and vendored, checksum-verified modules instead, the way
# upstream builds its release binaries, with the web UI that upstream
# commits built into the tree. See README.md.
#
# Upstream releases about every two weeks and supports only its latest
# release for the open-source version (its LTS lines are for the enterprise
# version), so there is one track, "main", that follows every release
# (component main). The tag regex skips the -cluster, -enterprise and
# VictoriaLogs tags.

name: victoriametrics
description: "VictoriaMetrics time series database, vmagent, vmalert and tools"
homepage: https://victoriametrics.com

upstream:
  git: https://github.com/VictoriaMetrics/VictoriaMetrics.git
  tag_regex: '^v(?P<version>\d+\.\d+\.\d+)$'

packaging:
  origin: https://salsa.debian.org/go-team/packages/victoriametrics.git
  ref: 8edbfc8eb7cecee204646b9d5cb8c6fadf2ab173  # 1.145.0+ds1-2, unstable

tracks:
  main:
    tag: "v1.155.0"
    commit: 3fec2f72414d00d1acda807c8818d7af90cc966d
    revision: 1
    go: "1.27.3"  # what upstream's release build uses (deployment/docker: golang:1.27.3); go.mod: go 1.27.3
    patches: patches/main  # Debian's test fix only; the patches that remove the web UI are dropped

overlays:
  # Pinned Go toolchain and vendored modules instead of dh-golang, built like
  # upstream's release binaries with the web UI (all releases).
  - patch: overlays/go-build.patch
