# Valkey: https://valkey.io
#
# Packaging is Debian's (salsa.debian.org/debian/valkey). debian/ is an
# unmodified import of the commit in packaging.ref; everything we change
# lives in patches/ and overlays/. See README.md in this directory.
#
# Valkey patches every supported minor line in parallel, so each minor is a
# track with its own APT component (v9.1, v9.0, …) in the valkey repository
# (deb.freshdeb.com/valkey). The aliases v9 and v8 follow the newest minor
# of their major.
# Support dates: https://valkey.io/topics/releases/

name: valkey
description: "Valkey key-value datastore (Redis fork)"
homepage: https://valkey.io

upstream:
  git: https://github.com/valkey-io/valkey.git
  # Release tags only; rc tags never match.
  tag_regex: '^(?P<version>\d+\.\d+\.\d+)$'

packaging:
  origin: https://salsa.debian.org/debian/valkey.git
  ref: d625d60ff17b73fa5d7eb4d1cfabc1ee2716d9c2  # 9.1.2-1, unstable

tracks:
  "9.1":
    tag: "9.1.3"
    commit: 29173b67508b2de4c0f0ed551f3b47cf19fc3ca8
    revision: 1
    eol: 2031-05-19
    patches: patches/9.1
  "9.0":
    tag: "9.0.7"
    commit: fe8d406c0b5a64ec897f6455e4de684629883764
    revision: 1
    eol: 2028-10-21
    patches: patches/9.0  # from Ubuntu's 9.0.4-0ubuntu0.2; Debian skipped 9.0
  "8.1":
    tag: "8.1.11"
    commit: 5fb5bc4b13b22084b54c7db2a88d14ce2f6fa867
    revision: 1
    eol: 2030-03-31
    patches: patches/8.1  # from Debian 8.1.4+dfsg1-2, CVE patches dropped (upstream)
  "8.0":
    tag: "8.0.12"
    commit: 3982d41ef1984629a95b6f7ea0adc7e0ac2e3df7
    revision: 1
    eol: 2027-09-15
    patches: patches/8.0  # from Debian 8.0.2+dfsg1-1

aliases:
  "9": "9.1"
  "8": "8.1"

overlays:
  # debhelper 13.6 has no dh_installsysusers; create the user and its
  # directories in postinst, the way Debian did before 9.1.
  - patch: overlays/legacy-sysusers.patch
    codenames: [jammy]
  # The "u!" (fully locked account) sysusers modifier needs systemd 256;
  # bookworm has 252 and noble 255. Plain "u" accounts are still created
  # without a usable password.
  - patch: overlays/sysusers-no-lock-modifier.patch
    codenames: [bookworm, noble]

build:
  # Debian runs the upstream suite with "|| true" (it never gates the
  # build) and it takes 40+ minutes. Our gate is tests/ plus Debian's
  # autopkgtests, run against the installed packages.
  options: [nocheck]
