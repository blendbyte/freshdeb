name: ci

# One workflow for pull requests, merges and manual rebuilds:
#   checks   catalog validation, shellcheck, unit and release tests
#   plan     work out which package/track/codename/arch combinations to build
#   build    build + verify each one on a native runner (no emulation)
#   release  publish to deb.freshdeb.com (main only)
#
# Pull requests only run checks and plan: plan rejects packaging changes
# without a version bump and lists what merging will build. Packages are
# built once, after merge; a failed check or build publishes nothing. To
# build a branch before merging, dispatch this workflow on it (publish stays
# off).
#
# What gets built is decided by scripts/freshdeb.py plan; see its docstring.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to build, space separated, or "all"'
        required: true
        default: all
      tracks:
        description: 'Tracks to build (e.g. "9.1 9.0"), or "all" active tracks'
        required: true
        default: all
      codenames:
        description: 'Codenames to build, or "all"'
        required: true
        default: all
      publish:
        description: 'Publish the result (main only; versions already published are kept)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


# Explicit bash makes GitHub run steps with -eo pipefail; the implicit
# default is "bash -e" only, where "cmd | tee log" hides a failing cmd.
defaults:
  run:
    shell: bash

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build test image
        run: docker build -f tests/release.Dockerfile -t freshdeb-tests .

      - name: Validate catalog
        run: docker run --rm -v "$PWD:/workspace:ro" freshdeb-tests python3 scripts/freshdeb.py validate

      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD:/workspace:ro" freshdeb-tests \
            bash -c 'shellcheck scripts/*.sh packages/*/tests/*.sh'

      - name: Unit and release tests
        run: docker run --rm -v "$PWD:/workspace:ro" freshdeb-tests

  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      publish: ${{ steps.plan.outputs.publish }}
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Plan builds
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          IN_PACKAGES: ${{ inputs.packages }}
          IN_TRACKS: ${{ inputs.tracks }}
          IN_CODENAMES: ${{ inputs.codenames }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          case "$EVENT" in
            pull_request)
              args=(--base "$PR_BASE")
              ;;
            push)
              # Each package is planned from the commit it was last released
              # from (the registry on deb.freshdeb.com), not just this push:
              # pending runs on main can be cancelled by newer pushes, and a
              # failed release of one project must be retried. Without it the
              # plan would only cover this push, so it has to load; only an
              # empty bucket (404, before the first release) has none.
              code="$(curl -sS --retry 3 --max-time 20 -w '%{http_code}' -o released.json \
                      https://deb.freshdeb.com/status.json)" || code=error
              case "$code" in
                200) ;;
                404) echo "No registry yet (first release)"; rm -f released.json ;;
                *) echo "::error::can't fetch https://deb.freshdeb.com/status.json ($code)"; exit 1 ;;
              esac
              args=(--base "$PUSH_BEFORE" --released released.json --publish)
              ;;
            workflow_dispatch)
              # shellcheck disable=SC2206
              args=(--packages $IN_PACKAGES --tracks $IN_TRACKS --codenames $IN_CODENAMES)
              if [[ "$IN_PUBLISH" == "true" ]]; then
                [[ "$REF" == "refs/heads/main" ]] || { echo "::error::publishing is only allowed from main"; exit 1; }
                args+=(--publish)
              fi
              ;;
          esac
          python3 scripts/freshdeb.py plan "${args[@]}" > plan.json
          {
            if [[ "$EVENT" == "pull_request" ]]; then
              echo "### Builds after merge"
              echo
              echo "Pull requests are not built. Merging builds and publishes these:"
            else
              echo "### Build plan"
            fi
            echo
            echo "| package | track | codename | arch | version | publish | upstream tests |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '.matrix.include[] | "| \(.package) | \(.track) | \(.codename) | \(.arch) | `\(.version)` | \(.publish) | \(if .nocheck then "skipped" else "run" end) |"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.package }} ${{ matrix.track }} ${{ matrix.codename }}/${{ matrix.arch }}
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: builders
          build-args: BASE_IMAGE=${{ matrix.image }}
          tags: freshdeb-builder:${{ matrix.codename }}-${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=builder-${{ matrix.codename }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.codename }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}

      - name: Build
        env:
          BUILDER_IMAGE: freshdeb-builder:${{ matrix.codename }}-${{ matrix.arch }}
          PUBLISH: ${{ matrix.publish }}
          NOCHECK: ${{ matrix.nocheck }}
        run: scripts/build.sh "${{ matrix.package }}" "${{ matrix.track }}" "${{ matrix.codename }}" "${{ matrix.arch }}" "$PWD/out"

      - name: Verify
        run: scripts/verify.sh "$PWD/out"

      - name: Summary
        if: always()
        run: |
          [[ -f out/build-info.json ]] || exit 0
          jq -r '"**\(.package) \(.version)** on \(.codename)/\(.arch): " +
                 (if .skipped then "skipped (\(.skip_reason))" else "built \(.debs | join(", "))" end)' \
            out/build-info.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-${{ matrix.package }}-${{ matrix.track }}-${{ matrix.codename }}-${{ matrix.arch }}
          path: |
            out/build-info.json
            out/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    # checks too: builds run alongside them, but nothing is published from a
    # commit that fails validation, shellcheck or the unit tests.
    needs: [checks, plan, build]
    # Skipped builds (count 0) are fine: an alias-only change still releases.
    if: |
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.plan.outputs.publish == 'true' &&
      needs.checks.result == 'success' &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      run_id: ${{ github.run_id }}
      projects: ${{ needs.plan.outputs.projects }}
    secrets: inherit
