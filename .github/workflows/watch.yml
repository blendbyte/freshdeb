name: watch

# Every 6 hours: look for new upstream releases and open one pull request
# per change, except a Go release, which is one pull request per Go minor.
# Nothing is published from here; merging the PR does that.
#
#   patch release in a track  -> PR bumping tag/commit (revision back to 1)
#   new minor/major line      -> PR adding the track (patches copied from the
#                                newest track) and moving aliases; needs a
#                                human: set eol, check the patches
#   Go patch release          -> one PR per Go minor (watch/go-1.26): every
#                                track on that minor rebuilt with the new
#                                toolchain (revision + 1), and golang's track
#                                updated; Go patch releases are mostly
#                                security fixes. One PR per track would each
#                                add the release to config.yaml and conflict
#                                with each other once one is merged.
#
# Each run refreshes its PR branches, except ones a maintainer pushed to,
# and doesn't reopen a change whose PR was closed without merging.
#
# Pull requests opened with the default GITHUB_TOKEN do not trigger ci.yml.
# Install a GitHub App on the repo (contents + pull-requests write), set its
# client ID as the FRESHDEB_APP_CLIENT_ID variable and its private key as the
# FRESHDEB_APP_PRIVATE_KEY secret: the PRs then come from <app>[bot], get
# their checks and plan, and notify maintainers like any other author.
# Without the app, the FRESHDEB_BOT_TOKEN secret (fine-grained PAT) is used.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: watch
  cancel-in-progress: false


# Explicit bash makes GitHub run steps with -eo pipefail; the implicit
# default is "bash -e" only, where "cmd | tee log" hides a failing cmd.
defaults:
  run:
    shell: bash

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the app's token
        id: app
        if: vars.FRESHDEB_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.FRESHDEB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FRESHDEB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || secrets.FRESHDEB_BOT_TOKEN || github.token }}
          fetch-depth: 0

      - name: Install PyYAML
        run: sudo apt-get install -y --no-install-recommends python3-yaml

      # Logs per package and track: our version, the newest upstream release
      # it follows, Go toolchains, and what watch decided. A package that
      # fails is logged and fails the job at the end; the others go on.
      - name: Find upstream releases
        id: find
        run: |
          status=0
          python3 scripts/freshdeb.py watch > changes.json || status=$?
          echo
          if [[ "$(jq length changes.json)" == 0 ]]; then
            echo "No changes: every track is up to date."
          else
            echo "Changes (one pull request each, or per group):"
            jq -r '.[] | "  \(.package) \(.track): \(.kind) -> \(.tag // ("Go " + .go))"
                         + (if .group then " (pull request watch/\(.group))" else "" end)' changes.json
          fi
          if [[ "$status" != 0 ]]; then
            echo "::error::watch failed for some packages, see ERROR lines above"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # One pull request per change, or per group of changes (a Go release),
      # each on its own: a failing one is logged and the rest still get theirs. A branch is only (re)written
      # by the bot: once a maintainer pushed to it, it is left alone. A
      # change whose pull request was closed unmerged isn't proposed again.
      - name: Open pull requests
        id: prs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.FRESHDEB_BOT_TOKEN || github.token }}
        run: |
          git config user.name "freshdeb-bot"
          git config user.email "packages@freshdeb.com"
          base="$(git rev-parse HEAD)"
          gh label create watch --color 0e8a16 --description "Opened by watch.yml" --force >/dev/null

          # A group's pull request: every change of one Go release.
          open_group_pr() {
            local unit="$1"
            group="$(jq -r .group <<<"$unit")"
            branch="watch/${group}"
            go="$(jq -r '[.changes[] | select(.kind == "toolchain") | .go]
                         + [.changes[] | select(.kind == "bump") | .tag | ltrimstr("go")] | .[0]' <<<"$unit")"
            rebuilds="$(jq -r '.changes[] | select(.kind == "toolchain")
                               | "- \(.package) \(.track): Go \(.from) -> \(.go)"
                                 + (if .reason then " (\(.reason): check that upstream builds with it, go.mod)" else "" end)' <<<"$unit")"
            updates="$(jq -r '.changes[] | select(.kind == "bump") | "- \(.package) \(.track): update to \(.tag)"' <<<"$unit")"
            names="$(jq -r '[.changes[] | select(.kind == "bump") | "\(.package) \(.track)"] | join(", ")' <<<"$unit")"
            if [[ -n "$rebuilds" && -n "$updates" ]]; then
              title="Go ${go}: update ${names}, rebuild Go packages"
            elif [[ -n "$updates" ]]; then
              title="Go ${go}: update ${names}"
            else
              title="Go ${go}: rebuild Go packages"
            fi
            body="Go released [${go}](https://go.dev/doc/devel/release#go$(cut -d. -f1-2 <<<"$go")). Go patch releases are mostly security fixes, and Go programs are static binaries that only get them by being rebuilt.

          This is every change for Go ${go} in one pull request: it pins Go ${go} (checksums from go.dev, added to config.yaml), rebuilds each track below with it (revision + 1), and updates Go's own package where listed. Merging builds, tests and publishes all of them.

          ${updates}
          ${rebuilds}"
            apply=(--groups "$group")
            paths=(packages config.yaml)
            push_pr
          }

          # A change's own pull request.
          open_pr() {
            local change="$1"
            package="$(jq -r .package <<<"$change")"
            track="$(jq -r .track <<<"$change")"
            tag="$(jq -r .tag <<<"$change")"
            kind="$(jq -r .kind <<<"$change")"
            companion="$(jq -r '.companion // empty' <<<"$change")"
            branch="watch/${package}-${track}"
            [[ "$kind" == "companion" ]] && branch="watch/${package}-${track}-${companion}"
            upstream="$(yq -r '.upstream.git // ""' "packages/${package}/package.yaml")"
            [[ "$kind" == "companion" ]] && upstream="$(yq -r ".companions[\"${companion}\"].upstream.git" "packages/${package}/package.yaml")"
            notes="${upstream%.git}/releases/tag/${tag}"
            # upstream.index packages have no git releases to link to.
            [[ -z "$upstream" ]] && notes="$(yq -r .homepage "packages/${package}/package.yaml")"

            if [[ "$kind" == "companion" ]]; then
              title="${package} ${track}: update ${companion} to ${tag}"
              body="${companion} released [${tag}](${notes}). This pins it for track \`${track}\` of ${package}; its packages are built against ${package} in the same job, versioned <${companion} version>+<${package} version>, so no revision bump is needed.

          Merging builds and tests every codename/arch, then publishes to the ${package} repository. If a build fails, nothing is published."
            elif [[ "$kind" == "bump" ]]; then
              title="${package} ${track}: update to ${tag}"
              body="Upstream released [${tag}](${notes}). This bumps track \`${track}\` and resets its revision to 1.

          Merging builds and tests every codename/arch, then publishes to the ${package} repository (the track's component and any alias pointing at it). If a build fails, nothing is published."
            else
              title="${package}: add track ${track} (${tag})"
              body="Upstream started a new release line: [${tag}](${notes}).

          This adds track \`${track}\` with patches copied from the newest existing track, and moves aliases: \`$(jq -c .aliases <<<"$change")\`.

          Before merging:
          - [ ] Set \`eol\` for the new track from upstream's support policy
          - [ ] Check \`packages/${package}/patches/${track}\` against Debian's packaging for this line
          - [ ] Decide whether moving the aliases now is right (users of the alias get a minor/major upgrade)"
            fi

            apply=(--packages "$package" --tracks "$track" --kinds "$kind" --groups "")
            [[ "$kind" == "companion" ]] && apply+=(--companions "$companion")
            paths=("packages/${package}" config.yaml)
            push_pr
          }

          # Shared: (re)write $branch from main with "watch ${apply[@]} --apply",
          # then push and open or update the pull request ($title, $body).
          push_pr() {
            closed="$(gh pr list --head "$branch" --state closed --json title,mergedAt \
                      -q '.[] | select(.mergedAt == null) | .title')"
            if grep -Fxq "$title" <<<"$closed"; then
              echo "${branch}: \"${title}\" was closed without merging; not proposing it again"
              return 0
            fi
            remote=""
            if git fetch -q origin "refs/heads/${branch}" 2>/dev/null; then
              remote="$(git rev-parse FETCH_HEAD)"
              if git log --format=%an "${base}..${remote}" | grep -vqx "freshdeb-bot"; then
                echo "${branch}: has commits by someone else; leaving it alone"
                return 0
              fi
            fi

            git checkout -q -f -B "$branch" "$base"
            git clean -qfd -- packages config.yaml
            python3 scripts/freshdeb.py watch "${apply[@]}" --apply >/dev/null
            git add -A "${paths[@]}"
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -q -m "$title"
            if [[ -n "$remote" ]] && git diff --quiet "$remote" HEAD -- "${paths[@]}"; then
              echo "${branch}: already up to date"
              return 0
            fi
            git push -q --force origin "$branch"
            state="$(gh pr view "$branch" --json state -q .state 2>/dev/null || true)"
            if [[ "$state" == "OPEN" ]]; then
              gh pr edit "$branch" --title "$title" --body "$body"
            else
              gh pr create --head "$branch" --base main --title "$title" --body "$body" --label "watch"
            fi
          }

          failed=0
          # Ungrouped changes one by one, then one unit per group.
          while read -r unit; do
            # A subshell with -e of its own: "if ! open_pr" would turn -e off.
            set +e
            if [[ "$(jq -r '.unit // empty' <<<"$unit")" == "group" ]]; then
              ( set -e; open_group_pr "$unit" )
            else
              ( set -e; open_pr "$unit" )
            fi
            status=$?
            set -e
            if [[ "$status" != 0 ]]; then
              echo "::error::pull request for $(jq -r 'if .unit then "watch/\(.group)" else "\(.package) \(.track) \(.kind)" end' <<<"$unit") failed"
              failed=1
            fi
          done < <(jq -c '(map(select(.group == null)) | .[]),
                          (map(select(.group != null)) | group_by(.group)[] | {unit: "group", group: .[0].group, changes: .})' changes.json)
          git checkout -q -f "$base"
          if [[ "$failed" != 0 ]]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if a package or pull request failed
        if: steps.find.outputs.failed == 'true' || steps.prs.outputs.failed == 'true'
        run: exit 1
