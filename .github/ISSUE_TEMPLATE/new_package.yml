name: New package
description: You'd like a package added.
labels: ["new-package"]
body:
  - type: markdown
    attributes:
      value: |
        See CONTRIBUTING.md for what fits freshdeb.

  - type: input
    id: package
    attributes:
      label: Package and upstream
      placeholder: "foo -- https://github.com/someone/foo"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it belongs here
      description: |
        Upstream has no APT repository of its own. Which versions do Debian/Ubuntu ship, and what's current upstream? Which release lines does upstream support?
    validations:
      required: true

  - type: input
    id: debian
    attributes:
      label: Debian packaging
      description: Link to the package on salsa.debian.org (or Launchpad if only Ubuntu has it), if there is one
